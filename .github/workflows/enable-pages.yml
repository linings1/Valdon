name: Enable GitHub Pages (gh-pages branch)

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - .github/workflows/enable-pages.yml

permissions:
  contents: read
  pages: write
  id-token: write
  administration: read

jobs:
  enable-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages from gh-pages branch
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            try {
              await github.rest.repos.createPagesSite({
                owner,
                repo,
                source: { branch: 'gh-pages', path: '/' },
                build_type: 'legacy',
              });
              core.info('Created GitHub Pages site (gh-pages / root).');
            } catch (e) {
              if (e.status === 409) {
                await github.rest.repos.updateInformationAboutPagesSite({
                  owner,
                  repo,
                  source: { branch: 'gh-pages', path: '/' },
                  build_type: 'legacy',
                });
                core.info('Updated GitHub Pages site (gh-pages / root).');
              } else {
                core.warning(`Pages API: ${e.message}`);
              }
            }

      - name: Check Pages URL
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data } = await github.rest.repos.getPages({ owner: context.repo.owner, repo: context.repo.repo });
              core.info(`Live URL: ${data.html_url}`);
            } catch (e) {
              core.warning(`Pages not live yet: ${e.message}`);
            }
